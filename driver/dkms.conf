PACKAGE_NAME="zt9101"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="zt9101_ztopmac_usb"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"
# The "env" prefix stops dkms from injecting KERNELRELEASE into the command.
# The vendor Makefile treats KERNELRELEASE as "already inside kbuild" and then
# defines no targets ("make: *** No targets. Stop.").
MAKE[0]="env make -j4 KVER=${kernelver} KSRC=/lib/modules/${kernelver}/build CONFIG_DEBUG_INFO_BTF_MODULES="
CLEAN="env make KVER=${kernelver} KSRC=/lib/modules/${kernelver}/build clean"
AUTOINSTALL="yes"
